# Builds the installable CaptionForge apps.
#   - Run manually: GitHub > Actions > "Package apps" > Run workflow
#   - Or push a version tag (v0.33.0) to also attach the files to a GitHub Release.
name: Package apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            name: mac-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CAPTIONFORGE_SKIP_FFMPEG_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Inno Setup (Windows installer builder)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Set up CaptionForge
        run: npm run setup
      - name: Build the app
        run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: CaptionForge-${{ matrix.name }}
          path: |
            dist-app/*.dmg
            dist-app/*.zip
            dist-app/*-setup.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-app/*.dmg
            dist-app/*.zip
            dist-app/*-setup.exe
